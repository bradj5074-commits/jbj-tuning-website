<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">JBJ Tuning + Solutions</title><desc id="desc">Compact white and neon green JBJ performance logo</desc>
<defs>
<linearGradient id="lime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8ff37"/><stop offset="1" stop-color="#70ee00"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f4f4f4"/><stop offset="1" stop-color="#bfc4c8"/></linearGradient>
<filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="20" fill="#000"/>
<path d="M390 124 C575 28 885 27 1068 130" fill="none" stroke="url(#lime)" stroke-width="17" stroke-linecap="round" filter="url(#softGlow)"/>
<path d="M438 127 C615 49 844 52 1002 130" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".95"/>
<path d="M883 145 L1040 80" stroke="url(#lime)" stroke-width="17" stroke-linecap="round" filter="url(#softGlow)"/>
<g font-family="Arial Black, Impact, Arial, sans-serif" font-style="italic" font-weight="900">
<text x="78" y="282" font-size="245" fill="url(#silver)" letter-spacing="-18">J</text>
<text x="336" y="282" font-size="245" fill="url(#lime)" letter-spacing="-18" filter="url(#softGlow)">B</text>
<text x="705" y="282" font-size="245" fill="url(#silver)" letter-spacing="-18">J</text>
</g>
<text x="84" y="354" font-family="Arial Black, Arial, sans-serif" font-style="italic" font-weight="900" font-size="64" fill="#fff" letter-spacing="5">TUNING</text>
<text x="424" y="354" font-family="Arial Black, Arial, sans-serif" font-style="italic" font-weight="900" font-size="64" fill="url(#lime)">+</text>
<text x="484" y="354" font-family="Arial Black, Arial, sans-serif" font-style="italic" font-weight="900" font-size="64" fill="#fff" letter-spacing="3">SOLUTIONS</text>
<text x="180" y="397" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#d9d9d9" letter-spacing="7">PERFORMANCE  |  DIAGNOSTICS  |  SOLUTIONS</text>
</svg>